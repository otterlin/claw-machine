<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="LaserNest Studio 雷射切割排版工具"><title>LaserNest Studio · 雷切排版工具</title>
<style>
:root{--bg:#0d1117;--panel:#141c25;--panel2:#192531;--line:#2a3a48;--text:#eef5f8;--muted:#8fa3b2;--cyan:#56d7ff;--orange:#ff9b54;--green:#9ee493;--red:#ff7788;--sheet:#c8915a;--cut:#ff6b72}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -18%,#1b3040,#0d1117 45%);color:var(--text);font:14px/1.45 Inter,system-ui,"Noto Sans TC",sans-serif;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{height:100vh;display:grid;grid-template:62px 1fr/290px 1fr 320px}header{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);background:#10171eee;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:12px;min-width:290px}.mark{width:34px;height:34px;border:2px solid var(--cyan);transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 0 20px #56d7ff55}.mark span{transform:rotate(-45deg);color:var(--cyan);font-size:17px}.brand h1{margin:0;font-size:16px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em}.online{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.top{margin-left:auto;display:flex;gap:8px}.btn{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#17232d;color:#cad6df}.btn:hover{border-color:#5a7b8c}.btn.primary{background:var(--orange);border-color:var(--orange);color:#23150d;font-weight:800}aside{padding:18px;overflow:auto;background:#121923cc}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.heading strong{font-size:15px}.badge{padding:3px 8px;border:1px solid #9ee49355;border-radius:20px;background:#9ee49315;color:var(--green);font-size:11px}.stack{display:grid;gap:8px}.part{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#16212b}.part.off{opacity:.4}.code{display:grid;place-items:center;width:25px;height:25px;border-radius:6px;border:1px solid #557284;color:var(--cyan);font-size:11px}.name{font-size:13px}.sub{color:var(--muted);font-size:10px}.switch{width:35px;height:20px;border:0;border-radius:30px;background:#35444f;padding:3px}.switch i{display:block;width:14px;height:14px;border-radius:50%;background:#81909c;transition:.2s}.switch.on{background:#16718a}.switch.on i{transform:translateX(15px);background:#d7fbff}.hint{color:var(--muted);font-size:11px;margin-top:14px}.stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(#101923dd,#0d1117f5),linear-gradient(90deg,transparent 49%,#29404e22 50%,transparent 51%);background-size:auto,64px 64px}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.8%,#56d7ff13 50%,transparent 50.2%),linear-gradient(45deg,transparent 49.8%,#56d7ff09 50%,transparent 50.2%);background-size:128px 128px;opacity:.5}.stagebar{position:absolute;top:22px;left:28px;right:28px;z-index:2;display:flex;justify-content:space-between}.view{display:flex;gap:6px}.view button{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#14202b;color:var(--muted);font-size:11px}.view button.active,.view button:hover{border-color:#477d8d;color:var(--cyan)}.sheet-wrap{position:relative;width:min(72%,700px);aspect-ratio:1.5/1;z-index:1;filter:drop-shadow(0 24px 30px #0009);transition:.3s}.sheet{position:absolute;inset:4% 2%;background:linear-gradient(135deg,#e0aa70,#a96839);border:2px solid #7b4b2d;box-shadow:inset 0 0 0 1px #f4c58a55;transform:perspective(800px) rotateX(4deg) rotateZ(-1deg)}.sheet:before{content:"600 × 400 mm";position:absolute;top:-28px;right:0;color:var(--cyan);font:12px monospace}.gridline{position:absolute;inset:0;background:linear-gradient(90deg,#8c573333 1px,transparent 1px),linear-gradient(#8c573333 1px,transparent 1px);background-size:40px 40px}.piece{position:absolute;border:2px solid var(--cut);background:#ffb07755;box-shadow:0 0 0 1px #641f2a55}.piece:after{content:attr(data-label);position:absolute;top:5px;left:6px;color:#5e2526;font-size:10px;font-weight:700}.piece.a{left:5%;top:8%;width:44%;height:30%}.piece.b{left:52%;top:8%;width:42%;height:30%}.piece.c{left:5%;top:43%;width:28%;height:48%}.piece.d{left:36%;top:43%;width:28%;height:48%}.piece.e{left:67%;top:43%;width:27%;height:48%}.measure{position:absolute;bottom:-35px;left:50%;transform:translateX(-50%);color:var(--cyan);font:12px monospace}.stagefoot{position:absolute;bottom:20px;left:28px;right:28px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.legend span{margin-right:15px}.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;background:var(--cut);border-radius:2px}.legend span:nth-child(2) i{background:var(--cyan)}.card{margin-bottom:10px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#16212b}.card h3{margin:0 0 12px;font-size:12px;color:#cad8e1;letter-spacing:.04em}.field{display:grid;grid-template-columns:1fr 82px 28px;align-items:center;gap:7px;margin:11px 0}.field label{color:var(--muted);font-size:12px}.field input,.field select{width:82px;padding:7px;border-radius:6px;border:1px solid #3a4e5d;background:#0e151c;color:var(--text)}.unit{font-size:11px;color:var(--muted)}.range{grid-column:1/-1;width:100%;accent-color:var(--cyan)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;border-radius:7px;background:#0f171f}.stat b{display:block;color:var(--cyan);font-size:18px;font-weight:500}.stat span{color:var(--muted);font-size:10px}.export{width:100%;padding:12px;margin-top:4px;border:0;border-radius:8px;background:linear-gradient(100deg,var(--orange),#ffc263);color:#21150c;font-weight:800}.toast{position:fixed;z-index:5;bottom:22px;left:50%;padding:10px 16px;border:1px solid #4c8092;border-radius:8px;background:#1e323d;color:#e9fbff;opacity:0;transform:translate(-50%,20px);transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:980px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template:62px auto auto auto/1fr}.left{order:1;border:0;border-bottom:1px solid var(--line)}.stage{order:2;min-height:500px}.right{order:3;border:0;border-top:1px solid var(--line)}.top .btn:not(.primary){display:none}.brand{min-width:auto}}
</style></head>
<body><div class="app"><header><div class="brand"><div class="mark"><span>⌬</span></div><div><h1>LASERNEST STUDIO</h1><small>MATERIAL NESTING LAB · 2026</small></div></div><div class="online"><span class="dot"></span>本機自動儲存中</div><div class="top"><button class="btn" id="newBtn">＋ 新排版</button><button class="btn" id="saveBtn">⤓ 儲存設定</button><button class="btn primary" id="topExport">輸出 SVG</button></div></header>
<aside class="left"><div class="eyebrow">01 / parts queue</div><div class="heading"><strong>待排板件</strong><span class="badge" id="activeCount">6 件</span></div><div class="stack" id="parts"></div><div class="heading"><strong>排列策略</strong></div><div class="card"><div class="field"><label for="gap">板件間距</label><input id="gap" type="number" min="1" max="20" value="5"><span class="unit">mm</span></div><div class="field"><label for="rotate">允許旋轉</label><button class="switch on" id="rotate"><i></i></button><span class="unit">自動</span></div></div><p class="hint">排版結果會依啟用中的板件與安全間距即時更新。紅色線條為切割線。</p></aside>
<main class="stage"><div class="stagebar"><div class="online"><span class="dot"></span><span>排版預覽 · <b id="sheetLabel">600 × 400 mm</b></span></div><div class="view"><button class="active" data-v="fit">適合畫面</button><button data-v="grid">格線</button><button data-v="focus">聚焦板件</button></div></div><div class="sheet-wrap" id="sheetWrap"><div class="sheet"><div class="gridline" id="grid"></div><div class="piece a" data-label="A 前板"></div><div class="piece b" data-label="B 後板"></div><div class="piece c" data-label="C 左側板"></div><div class="piece d" data-label="D 右側板"></div><div class="piece e" data-label="E 上板"></div><div class="measure">600 mm</div></div></div><div class="stagefoot"><div class="legend"><span><i></i>切割線</span><span><i></i>板材邊界</span></div><span>600 × 400 mm 標準板</span></div></main>
<aside class="right"><div class="eyebrow">02 / material</div><div class="heading"><strong>板材設定</strong><span class="badge">椴木合板</span></div><div class="card"><h3>工作板尺寸</h3><div class="field"><label for="sheetW">板材寬度</label><input id="sheetW" type="number" min="100" max="1200" value="600"><span class="unit">mm</span></div><div class="field"><label for="sheetH">板材高度</label><input id="sheetH" type="number" min="100" max="800" value="400"><span class="unit">mm</span></div><div class="field"><label for="material">板材種類</label><select id="material"><option>3 mm 椴木合板</option><option>5 mm 椴木合板</option><option>3 mm 壓克力</option></select><span></span></div></div><div class="card"><h3>排版摘要</h3><div class="summary"><div class="stat"><b id="used">72%</b><span>材料利用率</span></div><div class="stat"><b id="waste">28%</b><span>預估餘料</span></div><div class="stat"><b id="cuts">48</b><span>切割段數</span></div><div class="stat"><b id="count">6</b><span>啟用板件</span></div></div></div><div class="card"><h3>安全檢查</h3><p class="hint" id="check">✓ 所有板件均位於工作範圍內<br>✓ 板件間距符合設定值<br>✓ 可直接輸出雷切檔</p></div><button class="export" id="export">輸出排版 SVG　↗</button></aside></div><div class="toast" id="toast"></div>
<script>
const data=[['A','前板'],['B','後板'],['C','左側板'],['D','右側板'],['E','上板'],['F','底板']],state={on:data.map(()=>true),rotate:true};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function render(){ $('#parts').innerHTML=data.map((p,i)=>`<div class="part ${state.on[i]?'':'off'}" data-i="${i}"><div class="code">${p[0]}</div><div><div class="name">${p[1]}</div><div class="sub">${state.on[i]?'已加入排版':'未加入排版'}</div></div><button class="switch ${state.on[i]?'on':''}" aria-label="${p[1]} 排版"><i></i></button></div>`).join('');$$('.part').forEach(el=>el.onclick=()=>{state.on[+el.dataset.i]=!state.on[+el.dataset.i];render();update()})}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2100)}function update(){let n=state.on.filter(Boolean).length;let util=Math.max(0,Math.min(94,Math.round(46+n*4-($('#gap').value-5)*1.2)));$('#activeCount').textContent=n+' 件';$('#count').textContent=n;$('#used').textContent=util+'%';$('#waste').textContent=(100-util)+'%';$('#cuts').textContent=state.rotate?n*8:n*4;let a=+$(`#sheetW`).value,b=+$(`#sheetH`).value;$('#sheetLabel').textContent=`${a} × ${b} mm`;$('.measure').textContent=a+' mm';$('.sheet').style.aspectRatio=`${a}/${b}`;localStorage.setItem('lasernest',JSON.stringify({on:state.on,rotate:state.rotate,gap:$('#gap').value,sw:a,sh:b}));}
['gap','sheetW','sheetH','material'].forEach(id=>$('#'+id).addEventListener('input',update));$('#rotate').onclick=()=>{state.rotate=!state.rotate;$('#rotate').classList.toggle('on',state.rotate);update()};$('#newBtn').onclick=()=>{state.on=data.map(()=>true);$('#gap').value=5;$('#sheetW').value=600;$('#sheetH').value=400;render();update();toast('已建立新的排版工作區')};$('#saveBtn').onclick=()=>{update();toast('排版設定已儲存到本機')};$$('.view button').forEach(b=>b.onclick=()=>{$$('.view button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#grid').style.opacity=b.dataset.v==='grid'?'1':'.35';$('#sheetWrap').style.transform=b.dataset.v==='focus'?'scale(1.1)':'scale(1)';toast('已切換'+b.textContent)});
function exportSVG(){let w=+$(`#sheetW`).value,h=+$(`#sheetH`).value,g=+$(`#gap`).value,n=state.on.filter(Boolean).length,svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}mm" height="${h}mm" viewBox="0 0 ${w} ${h}"><title>LaserNest Studio layout</title><rect width="${w}" height="${h}" fill="none" stroke="#333"/>`;data.forEach((p,i)=>{if(!state.on[i])return;let x=20+(i%3)*(w/3),y=20+Math.floor(i/3)*(h/2-20),pw=w/3-30,ph=h/2-35;svg+=`<rect x="${x}" y="${y}" width="${pw}" height="${ph}" fill="none" stroke="#ff4f5e" stroke-width="0.6"/><text x="${x+4}" y="${y+10}" fill="#ff4f5e" font-size="5">${p[0]} ${p[1]}</text>`});svg+='</svg>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='lasernest-layout.svg';a.click();toast('排版 SVG 已下載')};$('#export').onclick=exportSVG;$('#topExport').onclick=exportSVG;const saved=JSON.parse(localStorage.getItem('lasernest')||'null');if(saved){state.on=saved.on||state.on;state.rotate=saved.rotate??true;$('#gap').value=saved.gap||5;$('#sheetW').value=saved.sw||600;$('#sheetH').value=saved.sh||400;$('#rotate').classList.toggle('on',state.rotate)}render();update();
</script></body></html>
