<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LaserBox Studio — 參數化雷射切割盒設計器" />
  <title>LaserBox Studio · 雷切盒設計器</title>
  <style>
    :root{--bg:#0d1117;--panel:#141b24;--panel2:#1a2430;--line:#2a3948;--text:#eef4f8;--muted:#8fa1b2;--cyan:#56d7ff;--orange:#ff9b54;--green:#9ee493;--red:#ff7788;--wood:#c98952;--wood-dark:#9c6034;--shadow:0 18px 48px #0007}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -10%,#1c3042 0,#0d1117 44%);color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui,"Noto Sans TC",sans-serif;min-height:100vh;overflow:hidden}
    button,input{font:inherit} button{cursor:pointer;color:inherit;border:0} .app{height:100vh;display:grid;grid-template-rows:62px 1fr;grid-template-columns:280px 1fr 320px}
    header{grid-column:1/-1;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px;background:#10171fee;backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:12px;min-width:280px}.brand-mark{width:34px;height:34px;border:2px solid var(--cyan);transform:rotate(45deg);display:grid;place-items:center;color:var(--cyan);box-shadow:0 0 22px #56d7ff55}.brand-mark span{transform:rotate(-45deg);font-size:17px}.brand h1{font-size:16px;margin:0;letter-spacing:.08em}.brand small{color:var(--muted);font-size:10px;display:block;margin-top:2px;letter-spacing:.14em}.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}.btn{border:1px solid var(--line);background:#17212b;border-radius:8px;padding:8px 12px;color:#c6d3dd}.btn:hover{border-color:#5d7a8e;background:#1d2d3a}.btn.primary{background:var(--orange);border-color:var(--orange);color:#20150f;font-weight:700}.btn.primary:hover{filter:brightness(1.08)}
    aside{background:#121923cc;overflow:auto;padding:18px}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;font-size:13px}.section-title strong{font-size:15px}.badge{font-size:11px;color:var(--green);background:#9ee49316;border:1px solid #9ee49344;border-radius:20px;padding:3px 8px}
    .parts{display:grid;gap:7px}.part{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);background:#16202b;border-radius:9px;transition:.2s}.part.off{opacity:.42}.part.active{border-color:#4e7185;background:#1a2b37}.part-code{display:grid;place-items:center;width:25px;height:25px;border:1px solid #547185;border-radius:6px;color:var(--cyan);font-size:11px}.part-name{font-size:13px}.part-sub{font-size:10px;color:var(--muted);margin-top:1px}.switch{width:35px;height:20px;border-radius:30px;background:#34424d;padding:3px;position:relative}.switch i{width:14px;height:14px;background:#8a99a4;border-radius:50%;display:block;transition:.2s}.switch.on{background:#16718a}.switch.on i{transform:translateX(15px);background:#d9fbff}
    .stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(#101923dd,#0d1117f5),linear-gradient(90deg,transparent 49%,#29404e22 50%,transparent 51%);background-size:auto,64px 64px}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.8%,#56d7ff13 50%,transparent 50.2%),linear-gradient(45deg,transparent 49.8%,#56d7ff09 50%,transparent 50.2%);background-size:128px 128px;opacity:.5}.stage-top{position:absolute;top:22px;left:28px;right:28px;display:flex;justify-content:space-between;z-index:2}.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green)}.view-tools{display:flex;gap:6px}.view-tools button{border:1px solid var(--line);background:#14202b;padding:6px 9px;border-radius:6px;color:var(--muted);font-size:11px}.view-tools button.active,.view-tools button:hover{color:var(--cyan);border-color:#477d8d}.box-scene{width:min(72%,620px);aspect-ratio:1.5/1;position:relative;z-index:1;filter:drop-shadow(0 24px 22px #0009);transform:rotateX(58deg) rotateZ(-36deg) rotateY(0deg);transition:transform .45s}.face{position:absolute;border:2px solid #653d27;background:linear-gradient(135deg,#dba36e,#b97643);box-shadow:inset 0 0 0 1px #f2c38f55}.face.front{width:62%;height:60%;left:19%;bottom:0;transform:skewY(-26deg);background:linear-gradient(100deg,#bb7745,#e1a66c)}.face.side{width:38%;height:60%;right:0;bottom:10%;transform:skewY(26deg);background:linear-gradient(100deg,#d99b61,#a9693b)}.face.top{width:62%;height:40%;left:19%;top:0;transform:skewX(-36deg);background:linear-gradient(125deg,#edbe82,#c78b50)}.face:after{content:"";position:absolute;inset:8px;background:repeating-linear-gradient(90deg,transparent 0 44px,#75472d99 45px 47px,transparent 48px 90px);opacity:.42}.front:before,.side:before,.top:before{content:"";position:absolute;border:1px dashed #ffe2b788;inset:7px;z-index:2}.measure{position:absolute;bottom:-56px;left:28%;color:var(--cyan);font:12px monospace;transform:rotateZ(36deg);white-space:nowrap}.measure:before{content:"↔";margin-right:8px}.stage-bottom{position:absolute;bottom:20px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:end;color:var(--muted);font-size:11px}.legend{display:flex;gap:14px}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--orange)}.legend span:nth-child(2):before{background:var(--cyan)}
    .card{border:1px solid var(--line);background:#16212b;border-radius:10px;padding:13px;margin-bottom:10px}.card h3{font-size:12px;margin:0 0 12px;color:#c8d7e2;letter-spacing:.04em}.field{display:grid;grid-template-columns:1fr 72px 28px;align-items:center;gap:7px;margin:11px 0}.field label{color:var(--muted);font-size:12px}.field input{width:72px;background:#0e151c;border:1px solid #3a4d5b;color:var(--text);padding:7px;border-radius:6px;text-align:right}.unit{color:var(--muted);font-size:11px}.range{grid-column:1/-1;width:100%;accent-color:var(--cyan)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px}.quick button{background:#1e2c38;border:1px solid var(--line);padding:8px;border-radius:6px;color:#a9bac6;font-size:11px}.quick button:hover{border-color:var(--cyan);color:var(--cyan)}.info{color:var(--muted);font-size:11px;margin:10px 0 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;background:#0f171f;border-radius:7px}.stat b{display:block;font-size:18px;color:var(--cyan);font-weight:500}.stat span{font-size:10px;color:var(--muted)}.export{width:100%;margin-top:8px;padding:12px;border-radius:8px;background:linear-gradient(100deg,var(--orange),#ffc263);color:#21150c;font-weight:800;letter-spacing:.04em}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#1e323d;border:1px solid #4c8092;color:#e9fbff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:980px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template:62px auto auto auto/1fr}.left,.right{border:0;border-bottom:1px solid var(--line)}.stage{min-height:500px;order:2}.left{order:1}.right{order:3}.brand{min-width:auto}.top-actions .btn:not(.primary){display:none}}
  </style>
</head>
<body>
  <div class="app">
    <header><div class="brand"><div class="brand-mark"><span>⌬</span></div><div><h1>LASERBOX STUDIO</h1><small>PARAMETRIC CUTTING LAB · 2026</small></div></div><div class="status"><span class="dot"></span><span>本機自動儲存中</span></div><div class="top-actions"><button class="btn" id="newBtn">＋ 新模型</button><button class="btn" id="saveBtn">⤓ 儲存設定</button><button class="btn primary" id="exportTop">輸出 SVG</button></div></header>
    <aside class="left"><div class="eyebrow">01 / panels</div><div class="section-title"><strong>板件清單</strong><span class="badge" id="partCount">6 片啟用</span></div><div class="parts" id="parts"></div><div class="section-title"><strong>快速操作</strong></div><div class="quick"><button id="allOn">全部啟用</button><button id="allOff">全部關閉</button></div><p class="info">點擊面板名稱可切換使用狀態。卡榫會依板厚自動計算。</p></aside>
    <main class="stage"><div class="stage-top"><div class="status"><span class="dot"></span><span>即時幾何預覽 · <b id="stageSize">200 × 150 × 80 mm</b></span></div><div class="view-tools"><button class="active" data-view="iso">立體</button><button data-view="front">前</button><button data-view="top">上</button><button data-view="side">側</button></div></div><div class="box-scene" id="boxScene"><div class="face top"></div><div class="face front"></div><div class="face side"></div><div class="measure" id="measure">200 mm</div></div><div class="stage-bottom"><div class="legend"><span>切割線</span><span>卡榫邊</span></div><span>拖曳預覽 · 滾輪縮放</span></div></main>
    <aside class="right"><div class="eyebrow">02 / parameters</div><div class="section-title"><strong>外殼設定</strong><span class="badge">矩形盒</span></div><div class="card"><h3>內部淨尺寸</h3><div class="field"><label for="width">X　底部內部寬度</label><input id="width" type="number" min="30" max="500" value="200"><span class="unit">mm</span><input class="range" id="widthRange" type="range" min="30" max="500" value="200"></div><div class="field"><label for="depth">Z　底部內部深度</label><input id="depth" type="number" min="30" max="500" value="150"><span class="unit">mm</span><input class="range" id="depthRange" type="range" min="30" max="500" value="150"></div><div class="field"><label for="height">Y　內部最高高度</label><input id="height" type="number" min="20" max="300" value="80"><span class="unit">mm</span><input class="range" id="heightRange" type="range" min="20" max="300" value="80"></div><p class="info">寬度與深度是組裝後的底部可用空間，板厚與卡榫只往外增加。</p></div><div class="card"><h3>板材與卡榫</h3><div class="field"><label for="thickness">板材厚度</label><input id="thickness" type="number" min="1" max="12" step=".5" value="3"><span class="unit">mm</span></div><div class="field"><label>卡榫模式</label><button class="switch on" id="tabSwitch" aria-label="卡榫模式"><i></i></button><span class="unit">自動</span></div></div><div class="card"><h3>模型摘要</h3><div class="summary"><div class="stat"><b id="area">0.36</b><span>材料面積 m²</span></div><div class="stat"><b id="cuts">48</b><span>預估切割段</span></div></div></div><button class="export" id="exportBtn">輸出 <span id="exportCount">6</span> 片雷切 SVG　↗</button></aside>
  </div><div class="toast" id="toast"></div>
  <script>
    const partsData=[['A','前板'],['B','後板'],['C','左側板'],['D','右側板'],['E','上板'],['F','底板']]; const state={parts:partsData.map(()=>true),tabs:true};
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    function renderParts(){ $('#parts').innerHTML=partsData.map((p,i)=>`<div class="part ${state.parts[i]?'active':'off'}" data-i="${i}"><div class="part-code">${p[0]}</div><div><div class="part-name">${p[1]}</div><div class="part-sub">${state.parts[i]?'啟用中':'已停用'}</div></div><button class="switch ${state.parts[i]?'on':''}" aria-label="${p[1]} 使用"><i></i></button></div>`).join(''); $$('#parts .part').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('.switch')||e.currentTarget===e.target.closest('.part')){state.parts[+el.dataset.i]=!state.parts[+el.dataset.i];renderParts();update();}})); }
    function val(id){return +$('#'+id).value} function update(){let w=val('width'),d=val('depth'),h=val('height'),t=val('thickness'),count=state.parts.filter(Boolean).length; $('#stageSize').textContent=`${w} × ${d} × ${h} mm`;$('#measure').textContent=`${w} mm`;$('#partCount').textContent=`${count} 片啟用`;$('#exportCount').textContent=count;$('#area').textContent=((2*w*d+2*w*h+2*d*h)/1e6).toFixed(2);$('#cuts').textContent=state.tabs?count*8:count*4;['width','depth','height'].forEach(id=>$('#'+id+'Range').value=$('#'+id).value);localStorage.setItem('laserbox-config',JSON.stringify({w,d,h,t,parts:state.parts,tabs:state.tabs}));}
    function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
    ['width','depth','height','thickness'].forEach(id=>$('#'+id).addEventListener('input',()=>update())); ['width','depth','height'].forEach(id=>$('#'+id+'Range').addEventListener('input',e=>{$('#'+id).value=e.target.value;update()}));
    $('#tabSwitch').addEventListener('click',()=>{state.tabs=!state.tabs;$('#tabSwitch').classList.toggle('on',state.tabs);update()}); $('#allOn').onclick=()=>{state.parts=state.parts.map(()=>true);renderParts();update()};$('#allOff').onclick=()=>{state.parts=state.parts.map(()=>false);renderParts();update()};
    $('#newBtn').onclick=()=>{['width','depth','height','thickness'].forEach((id,i)=>$('#'+id).value=[200,150,80,3][i]);state.parts=state.parts.map(()=>true);renderParts();update();toast('已建立新的空白模型')};$('#saveBtn').onclick=()=>{update();toast('設定已儲存到本機')};
    $$('.view-tools button').forEach(b=>b.onclick=()=>{$$('.view-tools button').forEach(x=>x.classList.remove('active'));b.classList.add('active');let v=b.dataset.view;$('#boxScene').style.transform=v==='iso'?'rotateX(58deg) rotateZ(-36deg)':v==='front'?'rotateX(0) rotateZ(0)':v==='top'?'rotateX(0) rotateZ(0) scale(.9)':'rotateY(90deg) rotateX(0)';toast(`已切換${b.textContent}視角`)});
    function exportSVG(){let w=val('width'),d=val('depth'),h=val('height'),t=val('thickness'),active=partsData.filter((_,i)=>state.parts[i]);let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w+40}mm" height="${(d+h+30)*active.length}mm" viewBox="0 0 ${w+40} ${(d+h+30)*active.length}"><title>LaserBox Studio cutting layout</title><g fill="none" stroke="#ff4f5e" stroke-width="0.6">`;active.forEach((p,i)=>{let y=i*(d+h+30)+10;svg+=`<rect x="20" y="${y}" width="${w}" height="${d}"/><text x="22" y="${y+10}" fill="#ff4f5e" stroke="none" font-size="5">${p[0]} ${p[1]} · ${w}×${d}mm · t${t}mm</text>`});svg+='</g></svg>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='laserbox-layout.svg';a.click();toast('SVG 雷切圖已下載');}
    $('#exportBtn').onclick=exportSVG;$('#exportTop').onclick=exportSVG; const saved=JSON.parse(localStorage.getItem('laserbox-config')||'null'); if(saved){$('#width').value=saved.w;$('#depth').value=saved.d;$('#height').value=saved.h;$('#thickness').value=saved.t;state.parts=saved.parts||state.parts;state.tabs=saved.tabs??true;$('#tabSwitch').classList.toggle('on',state.tabs)} renderParts();update();
  </script>
</body></html>
